# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# ---------------------------------------------------------------------------
# AGP 9 ships built-in Kotlin support, which by default refuses source sets
# registered through the `kotlin.sourceSets` DSL. KSP still registers its
# generated `build/generated/ksp/<variant>/{kotlin,java}` directories that way,
# so the two are briefly incompatible and configuration fails with:
#
#   "Using kotlin.sourceSets DSL to add Kotlin sources is not allowed with
#    built-in Kotlin. Kotlin source set 'debug' contains: [...ksp...]"
#
# This is AGP's own documented escape hatch
# (https://developer.android.com/r/tools/built-in-kotlin). It only re-permits
# the source-set registration; it does not disable built-in Kotlin, change the
# compiler, or weaken any check on our code. Remove it once KSP registers
# generated sources through `android.sourceSets`.
#
# Room is the only annotation processor in this build, so this is the entire
# blast radius. See docs/IMPLEMENTATION_PLAN.md section 2.2.
# ---------------------------------------------------------------------------
android.disallowKotlinSourceSets=false

# Room's generated code and the Compose compiler both benefit from a larger heap
# than the 2 GB default once KSP is in the graph.
org.gradle.caching=true
