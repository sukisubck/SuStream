[versions]
# --- Toolchain ---------------------------------------------------------------
# AGP 9 supplies Kotlin itself ("built-in Kotlin"), so the Kotlin version below is the one the
# compiler actually runs at and is not independently selectable. KSP must use the matching
# "<kotlin>-<ksp>" coordinate.
agp = "9.3.2"
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"

# !! METADATA CEILING !!
# A Kotlin 2.2.x compiler can only read class metadata produced up to Kotlin 2.3.0. Any dependency
# built with Kotlin 2.4+ fails the build with:
#   "Class 'kotlin.Unit' was compiled with an incompatible version of Kotlin.
#    The actual metadata version is 2.4.0, but the compiler version 2.2.0 can read versions up
#    to 2.3.0."
# Three libraries below are therefore deliberately NOT on their newest release. Before bumping
# any of them, check the `kotlin-stdlib` version in the artifact's Gradle module metadata:
#   https://repo1.maven.org/maven2/<group-path>/<artifact>/<version>/<artifact>-<version>.module
# See docs/IMPLEMENTATION_PLAN.md section 2.2.

# --- AndroidX core ----------------------------------------------------------
coreKtx = "1.19.0"
appcompat = "1.6.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
annotation = "1.10.0"

# --- Compose ----------------------------------------------------------------
composeBom = "2026.08.00"
tvMaterial = "1.1.0"
navigationCompose = "2.10.0"
paging = "3.5.1"

# --- Persistence ------------------------------------------------------------
room = "2.8.4"
datastore = "1.2.1"
securityCrypto = "1.1.0"

# --- Networking -------------------------------------------------------------
retrofit = "3.0.0"
okhttp = "5.5.0"
# 1.10.0+ is built with Kotlin 2.3.0/2.3.20. 1.9.0 is the Kotlin 2.2 line, which also keeps the
# serialization runtime aligned with the 2.2.10 compiler plugin. Metadata ceiling, see above.
kotlinxSerialization = "1.9.0"
# 1.11.0 requires stdlib 2.2.20; 1.10.2 is the last release on stdlib 2.1.x and is the safer pin
# against the metadata ceiling above.
kotlinxCoroutines = "1.10.2"
# 3.4.0+ is built with Kotlin 2.3.10 and 3.5.0+ with Kotlin 2.4, which exceeds the metadata
# ceiling above. 3.3.0 is the newest release on the Kotlin 2.2 line.
coil = "3.3.0"

# --- Playback ---------------------------------------------------------------
media3 = "1.11.0"

# --- Test -------------------------------------------------------------------
junit = "4.13.2"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"
uiautomator = "2.4.0"
mockk = "1.14.11"
turbine = "1.2.1"
robolectric = "4.16.1"
desugarJdkLibs = "2.1.5"

[libraries]
# --- Desugaring -------------------------------------------------------------
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# --- AndroidX core ----------------------------------------------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }

# --- Compose ----------------------------------------------------------------
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }

# --- Persistence ------------------------------------------------------------
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto-ktx", version.ref = "securityCrypto" }

# --- Networking -------------------------------------------------------------
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# --- Playback ---------------------------------------------------------------
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-exoplayer-dash = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }

# --- Test -------------------------------------------------------------------
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
